<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Definitions for clean rendering -->
  <defs>
    <style>
      .hynova-text-brand {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 75px;
        fill: #C01E25;
        letter-spacing: 0.035em;
      }
      .hynova-text-tagline {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 38px;
        fill: #231F20;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>

  <g id="hynova-monogram">
    <!-- Left slanted solid charcoal bar (unbroken, pristine upright) -->
    <polygon points="160,227 310,227 435,490 285,490" fill="#231F20" />
    <!-- Right slanted solid crimson bar (unbroken, complete upright) -->
    <polygon points="425,227 575,227 700,490 550,490" fill="#C01E25" />
    <!-- Solid crimson crossbar uniting both uprights seamlessly -->
    <polygon points="368,345 484,345 508,395 392,395" fill="#C01E25" />
    <!-- Dynamic HYNOVA innovation wing and limitless loop -->
    <path
      fill="#C01E25"
      fill-rule="evenodd"
      d="
        M 560,345
        C 625,345 745,355 815,405
        C 855,435 845,480 780,500
        C 700,520 610,480 565,420
        C 595,425 640,455 700,465
        C 755,475 790,455 780,430
        C 760,395 670,375 560,375
        Z
      "
    />
  </g>

  <!-- Brand Typography -->
  <text x="500" y="635" text-anchor="middle" class="hynova-text-brand">HYNOVA ENTERPRISES</text>
  <text x="500" y="755" text-anchor="middle" class="hynova-text-tagline">LIMITLESS ACCESS</text>
</svg>
